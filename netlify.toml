# Netlify build configuration for Vertex Web Solutions (Vite + React)

[build]
  # Use npx so we don't depend on node_modules/.bin/vite having the execute bit
  # (fixes: "sh: 1: vite: Permission denied")
  command = "npm ci && npx vite build"
  publish = "dist"

[build.environment]
  # Pin Node so installs are reproducible. Vite 6 requires Node 18+.
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# SPA fallback: every unknown path serves index.html so client-side routes
# like /no-refund work on refresh / direct links.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Sensible security + caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
